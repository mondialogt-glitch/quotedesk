<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quote Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--sf:#fff;--tx:#1b1c1e;--mu:#6b6e73;--ln:#dcdcd6;--ac:#f2b705;--ac-tx:#1b1c1e;--ok:#1d7a46;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--sf:#222427;--tx:#ececea;--mu:#9a9ea4;--ln:#37393d;--ok:#4cc180;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--sf:#222427;--tx:#ececea;--mu:#9a9ea4;--ln:#37393d;--ok:#4cc180;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
header{background:var(--ac);color:var(--ac-tx);padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
h1{font:700 26px 'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.5px}
nav{display:flex;gap:4px}nav button{background:transparent;border:0;font:600 15px Barlow,sans-serif;padding:8px 14px;border-radius:6px;color:inherit;cursor:pointer}
nav button.on{background:#1b1c1e;color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font:700 20px 'Barlow Condensed',Impact,sans-serif;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 9px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.b{font:600 14px Barlow,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
button.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:18px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mu);border-bottom:2px solid var(--ln);padding:7px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--ln);padding:6px;vertical-align:middle}
td input{padding:5px 6px;min-width:64px}.r{text-align:right}.num{font-variant-numeric:tabular-nums}
.warn{color:var(--bad);font-size:12px}.mu{color:var(--mu)}
.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .g{font:700 22px 'Barlow Condensed',Impact,sans-serif;border-top:2px solid var(--tx);margin-top:6px;padding-top:8px}
.kpi b{display:block;font:700 28px 'Barlow Condensed',Impact,sans-serif}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
.int{background:color-mix(in srgb,var(--ac) 14%,var(--sf));border-style:dashed}
#sug{position:relative}#sug ul{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--sf);border:1px solid var(--ln);border-radius:6px;max-height:260px;overflow:auto}
#sug li{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--ln)}#sug li:hover{background:var(--bg)}
.pr{display:none}
@page{size:A4 portrait;margin:10mm}
.paper{background:#fff;color:#000;border:1px solid var(--ln);padding:26px;font:13px/1.4 Calibri,Barlow,Arial,sans-serif;width:190mm;max-width:100%;margin:0 auto 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper p{margin:8px 0}table.qt{border-collapse:collapse;width:100%;font-size:12px}.qt th,.qt td{border:1px solid #000;padding:5px;text-align:center}.qt td.l{text-align:left}.qt tr.sm td{font-weight:700}.qt img{display:block;margin:0 auto}
@media print{header,nav,.np{display:none!important}body{background:#fff}main{padding:0;max-width:none}.paper{border:0;padding:0;margin:0;width:190mm;max-width:none}}

function parseCSV(t){const r=[];let row=[],c='',qt=false;for(let i=0;i<t.length;i++){const ch=t[i];if(qt){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qt=false}else c+=ch}else if(ch=='"')qt=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
function readCSV(f,cb){const fr=new FileReader();fr.onload=()=>{const rows=parseCSV(String(fr.result));if(rows.length<2)return alert('No rows found.');const h=rows[0].map(x=>x.trim().toLowerCase());cb(rows.slice(1),k=>h.findIndex(x=>k.some(w=>x.includes(w))))};fr.readAsText(f)}

const COLS={stock:o=>o.code,customers:o=>o.name,quotes:o=>o.id,sales:o=>o.name},fid=v=>String(v).replace(/\//g,'\u2215').slice(0,200)||'_';
const cfg=()=>({co:S.co,vat:S.vat,prefix:S.prefix,seq:S.seq});
function save(){if(!db||!ready)return;clearTimeout(saving);saving=setTimeout(push,400)}
async function push(){clearTimeout(saving);const ops=[];
for(const col in COLS){const cur={};S[col].forEach(o=>cur[fid(COLS[col](o))]=o);const prev=last[col]=last[col]||{};
for(const id in cur){const j=JSON.stringify(cur[id]);if(prev[id]!==j){ops.push(['set',col,id,cur[id]]);prev[id]=j}}
for(const id in prev)if(!(id in cur)){ops.push(['del',col,id]);delete prev[id]}}
const cj=JSON.stringify(cfg());if(last.cfg!==cj){ops.push(['cfg','config','main',cfg()]);last.cfg=cj}
for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([t,c,id,o])=>{const r=db.collection(c).doc(id);t=='del'?b.delete(r):b.set(r,JSON.parse(JSON.stringify(o)),{merge:t=='cfg'})});try{await b.commit()}catch(e){alert('Could not save to the shared database: '+e.message)}}}
function nextId(){const r=db.doc('config/main');return db.runTransaction(async t=>{const d=await t.get(r),c=d.data()||{},n=c.seq||S.seq;t.set(r,{seq:n+1},{merge:true});return (c.prefix||S.prefix)+String(n).padStart(4,'0')})}
function refreshUI(){nav();if(tab!='quote')render()}
function listen(col){return db.collection(col).onSnapshot(sn=>{let ch=false;const prev=last[col]=last[col]||{};
sn.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;const id=c.doc.id,arr=S[col],i=arr.findIndex(x=>fid(COLS[col](x))==id);
if(c.type=='removed'){if(i>=0){arr.splice(i,1);ch=true}delete prev[id];return}
const o=c.doc.data(),k=JSON.stringify(o);if(prev[id]===k&&i>=0)return;i>=0?arr[i]=o:arr.push(o);prev[id]=k;ch=true});
if(ch)refreshUI()},e=>denied(e))}
function cfgSnap(d){if(d.metadata.hasPendingWrites||!d.exists)return;const c=d.data();S.co=Object.assign(DEF().co,c.co||{});S.vat=c.vat??5;S.prefix=c.prefix||'BJ';S.seq=c.seq||S.seq;last.cfg=JSON.stringify(cfg());refreshUI()}
function denied(e){unsubs.forEach(f=>f());unsubs=[];ready=false;auth.signOut();loginView(e.code=='permission-denied'?'This account is not authorised. Ask the admin to add your email to the staff list.':'Error: '+e.message)}
function loginView(m){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>Sign in</h2><div><label>Email</label><input id="le" type="email" autocomplete="username"></div><div style="margin-top:10px"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')signIn()"></div><p class="warn">${esc(m||'')}</p><button class="b p" onclick="signIn()">Sign in</button></div>`}
async function signIn(){try{await auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value)}catch(e){loginView('Sign-in failed. Check your email and password.')}}
const _nav=nav;nav=function(){_nav();if(user)$('#nav').insertAdjacentHTML('beforeend',`<button onclick="auth.signOut()" title="${esc(user.email)}">Sign out</button>`)};
async function init(){try{const c=await db.doc('config/main').get();last={};
if(c.exists){S.stock=[];S.customers=[];S.quotes=[];S.sales=[]}ready=true;if(!c.exists)await push();
unsubs=Object.keys(COLS).map(listen);unsubs.push(db.doc('config/main').onSnapshot(cfgSnap,denied));
S.last=localStorage.getItem('qdlast')||'';Q=newQ();render()}catch(e){denied(e)}}
function boot(){if(FB.apiKey.startsWith('PASTE')){$('#app').innerHTML='<div class="card"><h2>Setup needed</h2><p>Open this file in a text editor and paste your Firebase settings into the <b>FB</b> block at the top of the script, then save and reload.</p></div>';return}
firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(u=>{user=u;unsubs.forEach(f=>f());unsubs=[];ready=false;u?init():loginView()})}
boot();
</script></body></html>
